<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="示範用報修登記系統：新增報修與查看最近清單。">
  <title>報修登記</title>
  <!-- PWA：安裝到主畫面所需的設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">示範系統：請只填寫虛構資料</p>
  </header>

  <div id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden>
    目前離線：可以查看畫面，但無法送出報修或更新清單。
  </div>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" required autocomplete="name">
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req">*</span></label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <fieldset class="field">
          <legend>類別 <span class="req">*</span></legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="category" value="設備" required><span>設備</span></label>
            <label class="choice"><input type="radio" name="category" value="網路"><span>網路</span></label>
            <label class="choice"><input type="radio" name="category" value="環境"><span>環境</span></label>
            <label class="choice"><input type="radio" name="category" value="其他"><span>其他</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="description">問題說明 <span class="req">*</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
          <div class="hint"><span id="desc-count">0</span> / 1000</div>
        </div>

        <fieldset class="field">
          <legend>緊急程度 <span class="req">*</span></legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label class="choice"><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label class="choice"><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>

        <button id="submit-btn" type="submit">送出報修</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
